<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item System Demo</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/ui.css">
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="aim-status" class="top-status">&lt; Using Active Item &gt;</div>

        <div class="ui-overlay">
            <div>
                <span class="key-hint">W</span><span class="key-hint">A</span><span class="key-hint">S</span><span class="key-hint">D</span> 移動 |
                <span class="key-hint">L-Click</span> 射擊 |
                <span class="key-hint">F</span> 道具 |
                <span class="key-hint">R</span> 生道具 |
                <span class="key-hint">中鍵</span> 拖移 (Shift 複製)
            </div>
            <div id="debug-info">Loading stats...</div>
            <div style="font-size: 12px; color: #555;"></div>
        </div>

        <div id="settings-panel">
            <!-- 1. Player Settings -->
            <div class="setting-group">
                <h3>Player Settings</h3>
                <select id="sel-player-settings">
                    <option value="PlayerStatus">Player Status</option>
                    <option value="RocketAttack">Rocket Attack</option>
                </select>

                <!-- Sub-group: Player Status -->
                <div id="group-player-status">
                    <div class="input-row">
                        <label>Max Player HP</label>
                        <input type="number" id="inp-player-hp" value="250">
                    </div>
                </div>

                <!-- Sub-group: Rocket Attack -->
                <div id="group-rocket-attack" class="hidden">
                    <div class="input-row">
                        <label>Speed (px/s)</label>
                        <input type="number" id="inp-rocket-speed" value="600">
                    </div>
                    <div class="input-row">
                        <label>Damage</label>
                        <input type="number" id="inp-rocket-dmg" value="15">
                    </div>
                    <div class="input-row">
                        <label>Radius (px)</label>
                        <input type="number" id="inp-rocket-rad" value="60">
                    </div>
                    <div class="input-row">
                        <label>Lifetime (s)</label>
                        <input type="number" id="inp-rocket-life" value="4">
                    </div>
                </div>
            </div>

            <!-- 2. General Settings (Traps) -->
            <div class="setting-group">
                <h3>General Settings</h3>
                <div class="input-row">
                    <label>Fire Dmg</label>
                    <input type="number" id="inp-fire-dmg" value="50">
                </div>
                <div class="input-row">
                    <label>Fire Rate (s)</label>
                    <input type="number" id="inp-fire-rate" value="0.7" step="0.1">
                </div>
            </div>

            <!-- 3. Items -->
            <div class="setting-group">
                <h3>Items</h3>
                <select id="sel-item-type">
                    <option value="HealBox">HealBox (治療箱)</option>
                    <option value="HealPack">HealPack (補血包)</option>
                    <option value="InvincibleStar">InvincibleStar (無敵星)</option>
                    <option value="EnergyDrink">EnergyDrink (能量飲料)</option>
                    <option value="MeteorStrike">MeteorStrike (隕石)</option>
                    <option value="ReviveFeather">ReviveFeather (復活羽毛)</option>
                </select>

                <!-- HealBox Settings -->
                <div id="group-healbox">
                    <div class="input-row">
                        <label>Max Aim Radius</label>
                        <input type="number" id="inp-aim-radius" value="200">
                    </div>
                    <div class="input-row">
                        <label>Tick Counts</label>
                        <input type="number" id="inp-heal-counts" value="5" step="1">
                    </div>
                    <div class="input-row">
                        <label>Radius (px)</label>
                        <input type="number" id="inp-heal-rad" value="170">
                    </div>
                    <div class="input-row">
                        <label>Heal Value</label>
                        <input type="number" id="inp-heal-val" value="25">
                    </div>
                    <div class="input-row">
                        <label>Tick Rate (s)</label>
                        <input type="number" id="inp-heal-tick" value="1" step="0.1">
                    </div>
                    <div class="input-row">
                        <label>Ground Duration (s)</label>
                        <input type="number" id="inp-healbox-dur" value="0" step="1" title="0 = permanent">
                    </div>
                </div>

                <!-- HealPack Settings -->
                <div id="group-healpack" class="hidden">
                    <div class="input-row">
                        <label>Duration (s)</label>
                        <input type="number" id="inp-pack-dur" value="10" step="1" title="0 = permanent">
                    </div>
                    <div class="input-row">
                        <label>Heal Value</label>
                        <input type="number" id="inp-pack-val" value="30">
                    </div>
                </div>

                <!-- InvincibleStar Settings -->
                <div id="group-star" class="hidden">
                    <div class="input-row">
                        <label>Duration (s)</label>
                        <input type="number" id="inp-star-dur" value="10" step="1" title="0 = permanent">
                    </div>
                    <div class="input-row">
                        <label>Buff Time (s)</label>
                        <input type="number" id="inp-star-effect" value="10" step="0.5">
                    </div>
                    <div class="input-row">
                        <label>Def Ratio</label>
                        <input type="number" id="inp-star-def" value="0" step="0.1" title="0 = No Damage">
                    </div>
                </div>

                <!-- MeteorStrike Settings -->
                <div id="group-meteorstrike" class="hidden">
                    <div class="input-row">
                        <label>Duration (s)</label>
                        <input type="number" id="inp-meteor-dur" value="0" step="1" title="0 = permanent">
                    </div>
                    <div class="input-row">
                        <label>Max Aim Radius</label>
                        <input type="number" id="inp-meteor-aim" value="1200">
                    </div>
                    <div class="input-row">
                        <label>Damage</label>
                        <input type="number" id="inp-meteor-dmg" value="150">
                    </div>
                    <div class="input-row">
                        <label>Radius (px)</label>
                        <input type="number" id="inp-meteor-rad" value="250">
                    </div>
                </div>

                <!-- EnergyDrink Settings -->
                <div id="group-energydrink" class="hidden">
                    <div class="input-row">
                        <label>Duration (s)</label>
                        <input type="number" id="inp-edrink-dur" value="20" step="1" title="0 = permanent">
                    </div>
                    <div class="input-row">
                        <label>Instant Plus</label>
                        <input type="number" id="inp-edrink-instant" value="0" step="5">
                    </div>
                    <div class="input-row">
                        <label>Effect Duration (s)</label>
                        <input type="number" id="inp-edrink-effect" value="10" step="1" title="Energy 不扣減時間">
                    </div>
                </div>

                <!-- ReviveFeather Settings -->
                <div id="group-revivefeather" class="hidden">
                    <div class="input-row">
                        <label>Duration (s)</label>
                        <input type="number" id="inp-feather-dur" value="10" step="1" title="0 = permanent">
                    </div>
                    <div class="input-row">
                        <label>Revive Time (s)</label>
                        <input type="number" id="inp-feather-revive" value="0" step="0.1" title="Death wait time with feather">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
