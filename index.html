<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Tech Demo - Field Object System</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/ui.css">
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="aim-status" class="top-status">&lt; Using Active Item &gt;</div>

        <div class="ui-overlay">
            <div>
                操作: <span class="key-hint">W</span><span class="key-hint">A</span><span class="key-hint">S</span><span class="key-hint">D</span> 移動 |
                <span class="key-hint">L-Click</span> 射擊 |
                <span class="key-hint">F</span> 道具模式 |
                <span class="key-hint">R</span> 生成被動道具 |
                <span class="key-hint">中鍵</span> 拖移 (Shift+中鍵 複製)
            </div>
            <div id="debug-info">Loading stats...</div>
            <div style="font-size: 12px; color: #555;">Tech Demo v5.0 | Modular Refactor</div>
        </div>

        <div id="settings-panel">
            <!-- 1. Player Settings -->
            <div class="setting-group">
                <h3>Player Settings</h3>
                <select id="sel-player-settings">
                    <option value="PlayerStatus">Player Status</option>
                    <option value="RocketAttack">Rocket Attack</option>
                </select>

                <!-- Sub-group: Player Status -->
                <div id="group-player-status">
                    <div class="input-row">
                        <label>Max Player HP</label>
                        <input type="number" id="inp-player-hp" value="250">
                    </div>
                </div>

                <!-- Sub-group: Rocket Attack -->
                <div id="group-rocket-attack" class="hidden">
                    <div class="input-row">
                        <label>Speed (px/s)</label>
                        <input type="number" id="inp-rocket-speed" value="600">
                    </div>
                    <div class="input-row">
                        <label>Damage</label>
                        <input type="number" id="inp-rocket-dmg" value="15">
                    </div>
                    <div class="input-row">
                        <label>Radius (px)</label>
                        <input type="number" id="inp-rocket-rad" value="60">
                    </div>
                    <div class="input-row">
                        <label>Lifetime (s)</label>
                        <input type="number" id="inp-rocket-life" value="4">
                    </div>
                </div>
            </div>

            <!-- 2. General Settings (Traps) -->
            <div class="setting-group">
                <h3>General Settings</h3>
                <div class="input-row">
                    <label>Fire Dmg</label>
                    <input type="number" id="inp-fire-dmg" value="50">
                </div>
                <div class="input-row">
                    <label>Fire Rate (s)</label>
                    <input type="number" id="inp-fire-rate" value="0.7" step="0.1">
                </div>
            </div>

            <!-- 3. Active: HealBox -->
            <div class="setting-group">
                <h3>Active: HealBox</h3>
                <div class="input-row">
                    <label>Max Aim Radius</label>
                    <input type="number" id="inp-aim-radius" value="200">
                </div>
                <div class="input-row">
                    <label>Tick Counts</label>
                    <input type="number" id="inp-heal-counts" value="5" step="1">
                </div>
                <div class="input-row">
                    <label>Radius (px)</label>
                    <input type="number" id="inp-heal-rad" value="170">
                </div>
                <div class="input-row">
                    <label>Heal Value</label>
                    <input type="number" id="inp-heal-val" value="25">
                </div>
                <div class="input-row">
                    <label>Tick Rate (s)</label>
                    <input type="number" id="inp-heal-tick" value="1" step="0.1">
                </div>
            </div>

            <!-- 4. Passive Item -->
            <div class="setting-group">
                <h3>Passive Item</h3>
                <select id="sel-passive-type">
                    <option value="HealPack">HealPack (補血包)</option>
                    <option value="InvincibleStar">InvincibleStar (無敵星)</option>
                </select>

                <!-- HealPack Settings -->
                <div id="group-healpack">
                    <div class="input-row">
                        <label>Duration (s)</label>
                        <input type="number" id="inp-pack-dur" value="10" step="1" title="-1 for infinite">
                    </div>
                    <div class="input-row">
                        <label>Heal Value</label>
                        <input type="number" id="inp-pack-val" value="30">
                    </div>
                </div>

                <!-- InvincibleStar Settings -->
                <div id="group-star" class="hidden">
                    <div class="input-row">
                        <label>Duration (s)</label>
                        <input type="number" id="inp-star-dur" value="10" step="1" title="-1 for infinite">
                    </div>
                    <div class="input-row">
                        <label>Buff Time (s)</label>
                        <input type="number" id="inp-star-effect" value="10" step="0.5">
                    </div>
                    <div class="input-row">
                        <label>Def Ratio</label>
                        <input type="number" id="inp-star-def" value="0" step="0.1" title="0 = No Damage">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
